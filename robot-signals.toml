# Signal-only copy of the robot for a 5 million RUB account. See README.md.
#
# Same strategy and risk rules as robot.toml, but in paper mode: a virtual account on real
# quotes. No order can reach the exchange from this config. Every virtual entry, stop move
# and exit is sent to Telegram as a trading signal (python -m robot.signals).
# Keep [risk] (except the size), [sessions] and [[slots]] in sync with robot.toml.

[robot]
mode = "paper"
account_id = ""
state_dir = "state-signals"

[risk]
capital_rub = 5000000       # virtual account size
risk_per_trade = 0.01       # target loss at the stop, share of capital
max_risk_per_trade = 0.03   # skip the trade if even 1 contract risks more
max_margin_share = 0.6      # GO of all robot positions <= 60% of capital
max_contracts = 2000        # liquidity cap per trade
max_stopouts_per_day = 2    # no new entries after 2 stop-loss exits in a day
fee_rate = 0.0005           # per side; matches the sandbox fill (0.05%). Check your tariff.
slippage_ticks = 1          # backtest / paper only

[sessions]                  # Moscow time
entry_start = "10:05"
entry_end = "18:25"
no_entry = [["13:50", "14:10"]]   # around the intraday clearing
flatten_at = "18:30"              # intraday strategies only
weekdays_only = true

# Trend following on hourly bars: 20-bar channel breakout, 3 ATR initial stop,
# 7-bar trailing channel (was 10: same profit, lower drawdown in backtests).
# Valid for the current schedule (decisions on weekdays 10:00-18:50 MSK only): if the
# robot also ran in the evening/weekend sessions, 7 bars would hurt GLDRUBF - re-test first.
# only in the direction of EMA(200).
# Chosen by backtest: profitable on CNYRUBF for every parameter set tried,
# in and out of sample; GLDRUBF weaker but positive. See README.md.
[[slots]]
ticker = "CNYRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

[[slots]]
ticker = "GLDRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# Rejected by backtest (lose money after fees on 15m bars), kept for research:
[[slots]]
ticker = "GAZPF"
strategy = "orb"
interval = "15m"
enabled = false

[[slots]]
ticker = "IMOEXF"
strategy = "meanrev"
interval = "15m"
enabled = false
