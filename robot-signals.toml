# «Торговые сигналы Сбер»: signal-only copy of the robot for a 6 million RUB account. See README.md.
#
# Same strategy and risk rules as robot.toml, but in paper mode: a virtual account on real
# quotes. No order can reach the exchange from this config. Every virtual entry, stop move
# and exit is sent to Telegram as a trading signal (python -m robot.signals).
# Same strategy as robot.toml, tuned for a larger account (see README, "Сигналы Сбер: оптимизация"):
# risk 1.25% per trade instead of 1%, margin cap 80% instead of 60%, plus USDRUBF.
# Keep [sessions] and the strategy params of the shared slots in sync with robot.toml.

[robot]
name = "Торговые сигналы Сбер"
mode = "paper"
account_id = ""
state_dir = "state-signals"

[telegram]
# A separate bot (TELEGRAM_BOT_TOKEN_SBER) or a topic in a group (TELEGRAM_THREAD_ID_SBER).
# Empty/missing secrets fall back to the shared TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID.
token_env = "TELEGRAM_BOT_TOKEN_SBER"
chat_env = "TELEGRAM_CHAT_ID_SBER"
thread_env = "TELEGRAM_THREAD_ID_SBER"

[risk]
capital_rub = 6000000       # virtual account size (was 5M; the difference is booked as a deposit)
risk_per_trade = 0.0125     # target loss at the stop, share of capital (robot.toml: 0.01)
max_risk_per_trade = 0.03   # skip the trade if even 1 contract risks more
max_margin_share = 0.8      # GO of all positions <= 80% of capital (robot.toml: 0.6)
max_contracts = 2000        # liquidity cap per trade
max_stopouts_per_day = 2    # no new entries after 2 stop-loss exits in a day
fee_rate = 0.0005           # per side; matches the sandbox fill (0.05%). Check your tariff.
slippage_ticks = 1          # backtest / paper only

[sessions]                  # Moscow time
entry_start = "10:05"
entry_end = "18:25"
no_entry = [["13:50", "14:10"]]   # around the intraday clearing
flatten_at = "18:30"              # intraday strategies only
weekdays_only = true

# Trend following on hourly bars: 20-bar channel breakout, 3 ATR initial stop,
# 7-bar trailing channel (was 10: same profit, lower drawdown in backtests).
# Valid for the current schedule (decisions on weekdays 10:00-18:50 MSK only): if the
# robot also ran in the evening/weekend sessions, 7 bars would hurt GLDRUBF - re-test first.
# only in the direction of EMA(200).
# Chosen by backtest: profitable on CNYRUBF for every parameter set tried,
# in and out of sample; GLDRUBF weaker but positive. See README.md.
[[slots]]
ticker = "CNYRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

[[slots]]
ticker = "GLDRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# Gazprom on quarterly futures (GZ): rolls to the next contract 5 days before expiry.
# Chosen over the perpetual GAZPF: better result over 2 years with fees and roll costs
# (+24.7% vs +17.6% at 1M RUB, same drawdown) and 3-4x the hourly volume. See README.md.
[[slots]]
ticker = "front:GAZP:GZ"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# US dollar perpetual: adds the best risk-adjusted gain on a multi-million account (profit/drawdown 5.8 -> 7.3).
# Moves together with CNYRUBF (both are bets on the ruble), so the drawdown grows a little.
[[slots]]
ticker = "USDRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# Rejected by backtest (lose money after fees on 15m bars), kept for research:
[[slots]]
ticker = "GAZPF"
strategy = "orb"
interval = "15m"
enabled = false

[[slots]]
ticker = "IMOEXF"
strategy = "meanrev"
interval = "15m"
enabled = false
