# Trading robot configuration. See README.md.

[robot]
name = "Торговый робот Тбанк"
# paper   - local simulation on real market data, no orders reach the exchange
# sandbox - T-Invest sandbox account (run `python -m robot sandbox-init`)
# live    - real money; also requires ROBOT_LIVE=yes in the environment
mode = "live"
account_id = "2000062287"
state_dir = "state"

[collateral]
# Idle cash goes into LQDT (money-market fund, ~key rate). T-Bank blocks futures GO in rubles:
# GO not covered by cash is a loan with a daily carry fee (40-700 RUB/day on «Трейдер», every
# calendar day, ~26%+ a year), so the robot keeps cash = blocked GO + ~2% of equity for
# variation margin and fees. It sells LQDT when cash < GO (right after an entry, the same pass)
# and buys when cash exceeds GO + 4%. Sizing uses cash + LQDT value as capital.
enabled = true
ticker = "LQDT"
class_code = "SPBRU"        # LQDT is API-tradeable only on this board
cash_target = 0.02
cash_max = 0.04
haircut = 0.40

[risk]
capital_rub = 1000000       # sizing uses min(this, free money + margin in use)
risk_per_trade = 0.01       # target loss at the stop, share of capital
max_risk_per_trade = 0.03   # skip the trade if even 1 contract risks more
max_margin_share = 0.6      # GO of all positions <= 60% of capital. LQDT counts as 60% of its value,
                            # so near the cap there is little spare collateral: the owner keeps ~1M RUB
                            # outside the account to top up if needed
max_contracts = 300         # liquidity cap per trade
max_stopouts_per_day = 2    # no new entries after 2 stop-loss exits in a day
fee_rate = 0.0004           # per side; actual futures fee on the "Трейдер" tariff (0.04%)
slippage_ticks = 1          # backtest / paper only

[sessions]                  # Moscow time
entry_start = "10:05"
entry_end = "18:25"
no_entry = [["13:50", "14:10"]]   # around the intraday clearing
flatten_at = "18:30"              # intraday strategies only
weekdays_only = true

# Trend following on hourly bars: 20-bar channel breakout only in the direction of
# EMA(200), 3 ATR initial stop, 7-bar trailing channel (was 10: same profit, lower
# drawdown in backtests).
# Valid for the current schedule (decisions on weekdays 10:00-18:50 MSK only): if the
# robot also ran in the evening/weekend sessions, 7 bars would hurt GLDRUBF - re-test first.
# Chosen by backtest: profitable on CNYRUBF for every parameter set tried,
# in and out of sample; GLDRUBF weaker but positive. See README.md.
[[slots]]
ticker = "CNYRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

[[slots]]
ticker = "GLDRUBF"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# Gazprom on quarterly futures (GZ): rolls to the next contract 5 days before expiry.
# Chosen over the perpetual GAZPF: better result over 2 years with fees and roll costs
# (+24.7% vs +17.6% at 1M RUB, same drawdown) and 3-4x the hourly volume. See README.md.
[[slots]]
ticker = "front:GAZP:GZ"
strategy = "trend"
interval = "1h"
params = { entry_n = 20, exit_n = 7, stop_atr = 3.0, trend_ema = 200 }

# Rejected by backtest (lose money after fees on 15m bars), kept for research:
[[slots]]
ticker = "GAZPF"
strategy = "orb"
interval = "15m"
enabled = false

[[slots]]
ticker = "IMOEXF"
strategy = "meanrev"
interval = "15m"
enabled = false
