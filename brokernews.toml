# Дайджест брокерского рынка (python3 -m brokernews). См. brokernews/README.md.
# На сервере код обновляется из main перед каждым запуском, поэтому правка этого файла
# в репозитории начинает действовать со следующего дайджеста.

[digest]
first_hours = 24      # за сколько часов собрать при самом первом запуске
weekdays_only = true  # по выходным выпусков нет; новости выходных войдут в выпуск понедельника
max_items = 250       # сколько кандидатов проходит редакторский отбор ChatGPT за раз
max_points = 10       # не больше стольких пунктов в выпуске: лучше короче, чем шум
max_chars = 600       # длина текста одного материала для ChatGPT

[telegram]
# Публичные каналы читаются через t.me/s/<канал>, вход в Telegram не нужен.
# Проверка: cd /opt/trading && sudo -u robot python3 -m brokernews channels
# Отраслевые каналы: каждый пост проходит тематический фильтр и редактора.
channels = [
  "sberinvestments",          # СберИнвестиции
  "naufortelegram",           # НАУФОР
  "centralbank_russia",       # Банк России
  "MoscowExchangeOfficial",   # Мосбиржа
  "brokervtb",                # ВТБ Брокер
  "frank_media",              # Frank Media — банки и брокеры
  "banksta",                  # Банкста
  "interfaxonline",           # Интерфакс
  "rbc_news",                 # РБК
]
# Рыночные каналы владельца: здесь в основном котировки, облигации и идеи, поэтому из них
# берём ТОЛЬКО посты про СберИнвестиции и собственные продукты Сбера (посевы, промо).
promo_watch = [
  "fm_invest", "markettwits", "bitkogan", "cbonds", "moex_derivatives", "silenceandmoney",
  "bondslab|bonds_lab|bondlab", "corpbonds", "bonds_t", "taurenin", "erabond", "IF_Bonds",
  "Kolyuchie_Investitsii", "obligacii_prosto",
]
# Официальные каналы компаний и регуляторов — в выпуске помечаются 🏛
official = ["sberinvestments", "naufortelegram", "centralbank_russia", "MoscowExchangeOfficial", "brokervtb",
            "cbonds", "moex_derivatives"]
max_pages = 3            # страниц по ~20 постов с канала за запуск

[news]
# Поисковые запросы — только отраслевые формулировки, без брендов конкурентов (бренд тянет
# их аналитику). Яндекс, если задан YANDEX_SEARCH_API_KEY и YANDEX_FOLDER_ID, иначе Google Новости.
search = [
  "СберИнвестиции",
  "рынок брокерских услуг",
  "брокерский бизнес",
  "брокерские счета частных инвесторов",
  "брокеры клиенты число счетов",
  "Банк России брокеры",
  "НАУФОР брокеры",
  "неквалифицированные инвесторы тестирование",
  "ИИС-3",
  "брокер тарифы комиссии изменение",
]
# Ленты СМИ и регуляторов
feeds = [
  "https://www.interfax.ru/rss.asp",
  "https://www.kommersant.ru/RSS/money.xml",               # Коммерсантъ «Деньги»
  "https://www.kommersant.ru/RSS/section-economics.xml",   # Коммерсантъ «Экономика»
  "https://www.vedomosti.ru/rss/news",
  "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",
  "https://www.banki.ru/xml/news.rss",
  "https://www.cbr.ru/rss/eventrss",                       # Банк России
  "https://www.moex.com/export/news.aspx?cat=100",         # Мосбиржа
  "https://frankmedia.ru/feed",                            # Frank Media
  "https://www.finversia.ru/rss",                          # Финверсия — отраслевое издание о брокерах
]
# Официальные сайты — пометка 🏛
official_domains = ["cbr.ru", "moex.com", "sberbank.com", "sberbank.ru", "naufor.ru", "minfin.gov.ru",
                    "nalog.gov.ru", "government.ru", "spbexchange.ru"]
# Сайты рыночной аналитики: с них берём только материалы про СберИнвестиции
analytics_domains = ["bcs-express.ru", "smart-lab.ru", "investing.com", "tradingview.com", "tbank.ru",
                     "journal.tinkoff.ru", "t-j.ru", "finam.ru", "conomy.ru", "dzen.ru", "quote.rbc.ru",
                     "investfuture.ru", "vsdelke.ru", "dohod.ru", "alfabank.ru", "vtb.ru", "gazprombank.ru",
                     "1prime.ru"]

# Первичное сито (регулярные выражения, регистр не важен). Материал проходит, если совпала
# хотя бы одна группа. Группы описывают ДЕЛОВЫЕ события отрасли: бренд брокера сам по себе
# не повод — только вместе со словами о бизнесе (клиенты, тарифы, сервисы, лицензии, сделки).
[keywords]
"СберИнвестиции" = [
  'сбер\w*\s*инвест',
  'sber\w*\s*invest',
  'сбер\w*.{0,60}(брокерск|ИИС|инвестиционн\w*\s*сч[её]т|доверительн)',
  '(брокерск|ИИС).{0,60}сбер(?!еж)',
  'первая\W+управляющ|сбер\s*управлени\w*\s*активами',
  '\bSBER?D\d|\bSbD\d|сбер\s*ИОС|дисконтн\w*\s*облигац\w*.{0,60}сбер|сбер\w*.{0,60}дисконтн\w*\s*облигац',
  'сб\s*секьюритизац',
  'структурн\w*\s*(облигац|продукт)\w*.{0,60}сбер|сбер\w*.{0,60}структурн\w*\s*(облигац|продукт)',
]
"Брокерский бизнес" = [
  'брокерск\w*\s*(бизнес|услуг|обслуживани|сч[её]т|компани|деятельност|рын|лицензи|клиент|тариф|сервис|приложени|платформ|подразделени|дом)',
  'брокер\w*\s.{0,50}(запустил|запустит|запуска|открыл|откроет|начал\w*\s*(предлагать|принимать|работ)|отключ|снизил\w*\s*комисси|повысил\w*\s*комисси|изменил\w*\s*тариф|ввел\w*\s*комисси|ввёл|отменил|прекратил|привлек|получил\w*\s*лицензи|лишил|отозвал|оштрафован|купил|продал|приобрел|приобрёл|объедин|покупк|продаж\w*\s*(бизнес|компани|дол)|сбо[йя]\s*в\s*работ)',
  '(т-инвестиц|тинькофф\s*инвестиц|альфа-инвестиц|\bБКС\b|финам|втб\s*мои\s*инвестиции|втб\s*брокер|газпромбанк\w*\s*инвестиц|\bатон\b|цифра\s*брокер|фридом\s*финанс|солид\s*брокер|ПСБ\s*брокер|совкомбанк\w*\s*инвестиц|райффайзен\w*\s*брокер|ак\s*барс\s*брокер|открытие\s*инвестиции)\w*.{0,80}(клиент|сч[её]т|тариф|комисси|приложени|сервис|функци|продукт|запуст|лицензи|сделк|доля\s*рынка|выручк|прибыль\s*брокер|назначен|глав\w*\s*(брокер|направлени)|штраф|ограничени|сбой)',
  '(число|количеств\w*)\s*(частн\w*\s*|розничн\w*\s*)?(инвесторов|клиентов\s*брокер|брокерских\s*сч)',
  'активн\w*\s*(клиент|инвестор|сч[её]т)\w*.{0,40}(брокер|бирж)',
  'рейтинг\w*\s*брокер|доля\s*(рынка\s*)?брокер|крупнейш\w*\s*брокер',
  'автоследовани|робо-?эдвайз|ИИ-?(ассистент|помощник)\w*.{0,40}(инвест|брокер)',
]
"Регулирование" = [
  '\bИИС\b|ИИС-3|индивидуальн\w*\s*инвестиционн\w*\s*сч',
  'квалифицированн\w*\s*инвестор|неквал',
  'тестировани\w*.{0,40}инвестор',
  'защит\w*\s*(прав\s*)?(розничн\w*\s*|частн\w*\s*)?инвестор',
  'НАУФОР|профучастни|профессиональн\w*\s*участник\w*\s*рынка\s*ценн',
  '(Банк\w*\s*России|\bЦБ\b|регулятор|Минфин|Госдум).{0,120}(брокер|розничн\w*\s*инвестор|частн\w*\s*инвестор|профучастник|маржинальн\w*\s*(торгов|кредит)|доверительн\w*\s*управлени)',
  'налог\w*.{0,60}(инвестор|ИИС|брокер|ценн\w*\s*бумаг)|вычет\w*.{0,40}(ИИС|инвест)|ЛДВ|льгот\w*\s*долгосрочн\w*\s*владени',
  'заблокированн\w*\s*(иностранн\w*\s*)?актив|разблокир\w*.{0,40}актив',
  'маржинальн\w*\s*(торговл|кредитовани)|непокрыт\w*\s*позиц',
  'программ\w*\s*долгосрочных\s*сбережений|\bПДС\b',
]
"Инфраструктура" = [
  '(мосбирж|московск\w*\s*бирж|\bMOEX\b|спб\s*бирж|санкт-петербургск\w*\s*бирж).{0,120}(частн\w*\s*инвестор|физлиц|розничн|брокер|торг\w*\s*(в\s*)?выходн|выходн\w*\s*дн|вечерн\w*\s*сесси|утренн\w*\s*сесси|режим\w*\s*торгов|доступ\w*\s*(для\s*)?неквал|комисси\w*\s*(для\s*)?(брокер|участник))',
  '(частн\w*\s*инвестор|физлиц|брокер).{0,120}(мосбирж|московск\w*\s*бирж|\bMOEX\b|спб\s*бирж)\w*.{0,60}(выходн|вечерн|режим|доступ|статистик|число|оборот)',
  'Финуслуг\w*.{0,60}(брокер|инвест)',
]
"Отраслевые события" = [
  '(конференци|форум|круглый\s*стол|сесси[яи]|выступлени)\w*.{0,120}(брокер|НАУФОР|розничн\w*\s*инвестор|частн\w*\s*инвестор)',
  '(брокер|НАУФОР|розничн\w*\s*инвестор).{0,120}(конференци|форум|круглый\s*стол)',
  'финансов\w*\s*конгресс|финополис',
]

# Рыночный контент — отбрасывается сразу (это не новости отрасли, даже если их выпустил брокер).
[exclude]
patterns = [
  # аналитика и прогнозы
  'прогноз\w*\s*(по\s*)?(акци|цен|курс|индекс|рынк\w*\s*акци|бумаг|котировк|дивиденд|доходност|ставк)|целев\w*\s*(цен|уровн)|рекомендаци\w*\s*(покупать|продавать|держать|«)|рекомендуют\s*(покупать|продавать)|пересмотрел\w*\s*(прогноз|оценк|таргет|целев|рекомендац)|повысил\w*\s*(оценк|таргет)|понизил\w*\s*(оценк|таргет)|потенциал\w*\s*(роста|снижени|доходност)|апсайд|фаворит\w*|топ-?\d+\s*(акци|бумаг|облигац)|стратеги\w*\s*на\s*(20\d\d|\d\s*(квартал|полугоди))|модельн\w*\s*портфел|портфел\w*\s*(акци|облигац)\s*на|какие\s*(акции|бумаги|облигации)',
  'торгов\w*\s*иде|инвест\w*\s*иде|технически\w*\s*анализ|точк\w*\s*вход|стоп-?лосс|тейк-?профит',
  # котировки и итоги торгов
  'итоги\s*(торгового\s*)?(дня|недели|сессии)|как\s*прош[её]л\s*(день|торговый)|закрываем\s*торговый|индекс\w*\s*(мосбирж|ММВБ|IMOEX|РТС|RGBI)\w*.{0,40}(пункт|снизил|вырос|упал|прибавил|потерял|%)|котировк|акции\s+\S+\s+(выросли|подорожали|подешевели|упали|растут|падают)',
  # размещения и эмитенты
  'ориентир\w*\s*(ставки\s*)?купон|книг\w*\s*заявок|сбор\w*\s*заявок|купон\w*\s*\d|доходност\w*\s*к\s*погашени|\bIPO\b|\bSPO\b|листинг|делистинг|дивиденд|отчетност\w*\s*по\s*(МСФО|РСБУ)|финансов\w*\s*результат\w*\s*(эмитент|компани)',
  # не брокерский бизнес
  'страхов\w*|вклад\w*\s*(под|с\s*ставк)|ипотек\w*|криптобирж|биткоин|криптовалют|букмекер',
  'подкаст|weekly\s*news|в\s*эфир|прям\w*\s*эфир|вебинар|розыгрыш|конкурс\w*\s*(для|среди)',
]
# Исключение из исключений: продуктовые новости СберИнвестиций и собственные бумаги Сбера,
# которые СберИнвестиции предлагают клиентам (например, «СберИнвестиции запустили рекомендации»).
keep_if = 'сбер\w*\s*инвест\w*.{0,80}(запуст|сервис|функци|приложени|клиент|тариф|комисси|продукт|ассистент|платформ|нов\w*\s*(возможност|раздел))|\bSBER?D\d|\bSbD\d|дисконтн\w*\s*облигац\w*.{0,60}сбер|сбер\w*.{0,60}дисконтн\w*\s*облигац'

# Разделы дайджеста по порядку: ключ = заголовок. Ключи используются в ответе ChatGPT.
[sections]
sber = "🟢 СБЕРИНВЕСТИЦИИ"
brokers = "🏦 БРОКЕРЫ"
regulation = "⚖️ РЕГУЛИРОВАНИЕ"
infrastructure = "📊 БИРЖИ И ИНФРАСТРУКТУРА"
events = "🎤 ОТРАСЛЕВЫЕ СОБЫТИЯ"

[llm]
model = "gpt-5-mini"        # пишет выпуск
select_model = "gpt-5"      # отбирает материалы — здесь нужна более сильная модель
timeout = 300
# Редакционная политика: по ней ChatGPT сначала отбирает материалы, затем пишет выпуск.
# Формат ответов (JSON) программа добавляет сама.
policy = """
Ты — редактор отраслевого Telegram-канала о брокерском обслуживании в России. Читатели —
руководители и продуктовые команды брокерского бизнеса Сбера (СберИнвестиции). Им нужны
новости ИНДУСТРИИ БРОКЕРСКОГО ОБСЛУЖИВАНИЯ и место СберИнвестиций в ней — не рынок ценных
бумаг и не инвестиционные советы.

БЕРЁМ:
- СберИнвестиции: продукты, тарифы, функции приложения, клиенты и их число, обороты, позиции
  в рейтингах, заявления руководителей, маркетинг и посевы СберИнвестиций, собственные
  облигации Сбера (дисконтные, структурные, секьюритизация), которые предлагаются клиентам.
- Брокеры-конкуренты как бизнес: новые продукты и сервисы, тарифы и комиссии, число клиентов
  и активов, финрезультаты брокерского бизнеса, сделки M&A, лицензии, назначения,
  выход новых игроков, рейтинги брокеров.
- Регулирование брокерской деятельности: решения и инициативы Банка России, Минфина,
  Госдумы, НАУФОР — квалы/неквалы и тестирование, ИИС, налоги инвесторов, защита розничных
  инвесторов, маржинальная торговля, требования к брокерам, санкции регулятора к брокерам,
  заблокированные активы.
- Инфраструктура для брокеров и их клиентов: новые режимы торгов, торговые часы, доступ
  частных инвесторов к инструментам, комиссии бирж, статистика Мосбиржи и ЦБ по частным
  инвесторам и брокерским счетам.
- Отраслевые конференции и форумы: что сказали представители брокеров, бирж, регулятора
  о брокерской отрасли.
- Масштабные инциденты: массовый сбой у крупного брокера, штраф или ограничение регулятора.

НЕ БЕРЁМ (даже если упомянут Сбер или брокер как источник аналитики):
- котировки, значения индексов, движение отдельных бумаг, обзоры рынка, торговые идеи,
  прогнозы курсов и цен, аналитику брокеров по рынку;
- размещения и купоны сторонних облигаций, IPO/SPO, листинги, дивиденды, отчётность
  эмитентов;
- единичные жалобы клиентов и единичные сбои;
- страхование, вклады, кредиты, криптовалюту;
- подкасты, эфиры, вебинары, рекламу чужих продуктов, развлекательный контент;
- макроэкономику и геополитику без прямого влияния на брокерскую отрасль.

Если сомневаешься — не бери. Лучше короткий выпуск из 3 сильных новостей, чем 15 слабых.
"""
