# Дайджест брокерского рынка (python3 -m brokernews). См. brokernews/README.md.
# На сервере код обновляется из main перед каждым запуском, поэтому правка этого файла
# в репозитории начинает действовать со следующего дайджеста.

[digest]
first_hours = 24      # за сколько часов собрать при самом первом запуске
max_items = 120       # сколько материалов отдавать ChatGPT за раз
max_chars = 600       # длина текста одного материала для ChatGPT

[telegram]
# Публичные каналы читаются через t.me/s/<канал>, вход в Telegram не нужен.
# Проверить список на сервере: sudo -u robot python3 -m brokernews channels (из /opt/trading)
channels = [
  "banksta",             # Банкста
  "frank_media",         # Frank Media
  "markettwits",         # MarketTwits
  "centralbank_russia",  # Банк России
  "rbc_news",            # РБК
  "interfaxonline",      # Интерфакс
  "vtbmyinvestments",    # ВТБ Мои Инвестиции
  "alfawealth",          # Альфа-Капитал
  "sberinvestments",     # СберИнвестиции (проверить имя)
  "moex_official",       # Мосбиржа (проверить имя)
]
# Каналы, из которых брать все посты без фильтра по ключевым словам
channels_all = []
max_pages = 3            # страниц по ~20 постов с канала за запуск

[news]
# Google Новости, за последние 2 дня
google_news = [
  "СберИнвестиции",
  "Сбер брокерское обслуживание",
  "брокерские услуги",
  "рынок брокерских услуг",
  "ИИС индивидуальный инвестиционный счет",
  "Мосбиржа частные инвесторы",
  "Т-Инвестиции",
  "Альфа-Инвестиции",
  "БКС брокер",
  "Финам брокер",
  "ВТБ Мои Инвестиции",
  "Банк России брокеры регулирование",
]
# RSS-ленты СМИ (недоступная лента пропускается с предупреждением)
feeds = [
  "https://www.banki.ru/xml/news.rss",
  "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",
  "https://www.interfax.ru/rss.asp",
  "https://www.kommersant.ru/RSS/news.xml",
  "https://www.vedomosti.ru/rss/news",
]

# Разделы и ключевые слова (регулярные выражения, регистр не важен).
# Порядок разделов = приоритет. Материал берётся, если совпал хотя бы один раздел.
[keywords]
"Сбер" = [
  'сбер\w*\s*инвест',
  'sber\w*\s*invest',
  'сбер.{0,80}(брокер|ИИС|бирж|инвестор|облигац|акци|фонд|доверительн)',
  '(брокер|ИИС|бирж|инвестор).{0,80}сбер(?!еж)',
  'первая\W+управляющ|сбер\s*управлени\w*\s*активами',
]
"Конкуренты" = [
  'т-инвестиц|тинькофф\s*инвестиц|т-банк.{0,60}(брокер|инвест)',
  'альфа-инвестиц|альфа\s*капитал',
  '\bБКС\b',
  'финам',
  'втб\s*мои\s*инвестиции|втб.{0,60}брокер',
  'газпромбанк.{0,60}(брокер|инвест)|\bатон\b|цифра\s*брокер|фридом\s*финанс|солид\s*брокер',
]
"Рынок и регулирование" = [
  'брокер',
  '\bИИС\b|индивидуальн\w*\s*инвестиционн',
  'мосбирж|московск\w*\s*бирж|\bMOEX\b|спб\s*бирж',
  'частн\w*\s*инвестор|розничн\w*\s*инвестор|физлиц\w*.{0,40}(бирж|акци|облигац)',
  'квал\w*\s*инвестор',
  'доверительн\w*\s*управлени|паев\w*\s*фонд|\bБПИФ',
  '\bIPO\b|\bSPO\b|размещени\w*\s*акций',
  'маржинальн',
  'программ\w*\s*долгосрочных\s*сбережений|\bПДС\b',
]

[exclude]
patterns = ['криптобирж|биткоин', 'букмекер']

[llm]
model = "gpt-5-mini"
timeout = 300
prompt = '''
Ты аналитик брокерского рынка России. Тебе дан пронумерованный список новостей
и постов из Telegram за период. Составь дайджест на русском языке для руководителя
в брокерском бизнесе Сбера.

Структура (раздел без новостей пропускай):
<b>🔥 Главное</b> — 3–5 самых значимых событий.
<b>🟢 Сбер</b> — СберИнвестиции, брокерский бизнес Сбера, упоминания Сбера в контексте рынка.
<b>🏦 Конкуренты</b> — Т-Инвестиции, Альфа, БКС, Финам, ВТБ и другие брокеры.
<b>📈 Рынок и регулирование</b> — Банк России, Минфин, биржи, ИИС, налоги, статистика.
<b>👀 Что обсуждают в Telegram</b> — заметные мнения и слухи (помечай как неподтверждённые).

Правила:
- Объединяй дубли: одно событие из разных источников — один пункт.
- Отбрасывай нерелевантное (реклама, не про брокерский рынок РФ).
- Каждый пункт — 1–2 предложения с фактами и цифрами, в конце ссылка
  в формате <a href="URL">источник</a> (1–2 лучших источника).
- Форматирование — только Telegram HTML: теги <b>, <i>, <a href="...">. Без Markdown,
  без звёздочек и решёток. Пункты начинай с «• ».
- Ничего не выдумывай: только то, что есть в материалах.
'''
