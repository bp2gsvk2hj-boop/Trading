# Дайджест брокерского рынка (python3 -m brokernews). См. brokernews/README.md.
# На сервере код обновляется из main перед каждым запуском, поэтому правка этого файла
# в репозитории начинает действовать со следующего дайджеста.

[digest]
first_hours = 24      # за сколько часов собрать при самом первом запуске
max_items = 250       # сколько кандидатов проходит редакторский отбор ChatGPT за раз
max_points = 10       # не больше стольких пунктов в выпуске: лучше короче, чем шум
max_chars = 600       # длина текста одного материала для ChatGPT

[telegram]
# Публичные каналы читаются через t.me/s/<канал>, вход в Telegram не нужен.
# Проверить список на сервере: sudo -u robot python3 -m brokernews channels (из /opt/trading)
# Через «|» — варианты @имени, если точное неизвестно: бот сам найдёт рабочий.
channels = [
  # каналы владельца (скриншоты 19.11.2026)
  "sberinvestments|SberInvest|sberinvestment",               # СберИнвестиции
  "sberinvestpro|sberinvestments_pro|SberInvestPRO",         # СберИнвестиции ПРО
  "MoscowExchangeOfficial",                                  # MOEX — Московская биржа
  "moex_derivatives|moexderivatives",                        # MOEX Derivatives
  "moex_bonds|moexbonds",                                    # MOEX Bonds
  "naufortelegram",                                          # НАУФОР
  "cbonds|cbonds_ru|cbondsru",                               # Cbonds
  "fm_invest",                                               # Frank Media Invest
  "frank_media",                                             # Frank Media
  "banksta",                                                 # Банкста
  "markettwits",                                             # MarketTwits
  "bitkogan",                                                # bitkogan
  "bondslab|bonds_lab|bondlab",                              # Bonds lab
  "silenceandmoney",                                         # Тихие деньги: рынки и инвестиции
  "goodbonds|good_bonds|goodbonds_channel",                  # Good Bonds (если это чат, а не канал, — не читается)
  # ранее добавленные
  "centralbank_russia",                                      # Банк России
  "rbc_news",                                                # РБК
  "interfaxonline",                                          # Интерфакс
  "brokervtb",                                               # ВТБ Брокер
  "alfawealth",                                              # Альфа-Капитал
  "corpbonds", "bonds_t", "taurenin", "erabond", "IF_Bonds", "Kolyuchie_Investitsii", "obligacii_prosto",
]
# Официальные каналы компаний и регуляторов — в дайджесте помечаются 🏛
official = ["centralbank_russia", "sberinvestments", "SberInvest", "sberinvestpro", "MoscowExchangeOfficial",
            "moex_derivatives", "moex_bonds", "naufortelegram", "cbonds", "brokervtb", "alfawealth"]
# Каналы, из которых брать все посты без фильтра по ключевым словам
channels_all = []
max_pages = 3            # страниц по ~20 постов с канала за запуск

[news]
# Поиск новостей. Если задан ключ Yandex Search API (YANDEX_SEARCH_API_KEY и YANDEX_FOLDER_ID
# в /etc/trading-robot.env) — ищем в Яндексе (свежие сначала), иначе в Google Новостях.
search = [
  "СберИнвестиции",
  "СберИнвестиции брокер новый сервис",
  "брокерское обслуживание",
  "рынок брокерских услуг",
  "брокеры частные инвесторы число клиентов",
  "индивидуальный инвестиционный счет ИИС",
  "Банк России брокеры",
  "неквалифицированные инвесторы тестирование",
  "НАУФОР",
  "Т-Инвестиции брокер",
  "ВТБ Мои Инвестиции",
  "Альфа-Инвестиции",
  "БКС Мир инвестиций",
  "Финам брокер",
  "Мосбиржа частные инвесторы статистика",
  "облигации Сбербанка для частных инвесторов",
]
# RSS-ленты СМИ и регуляторов (недоступная лента пропускается, владельцу — предупреждение)
feeds = [
  "https://www.banki.ru/xml/news.rss",
  "https://www.interfax.ru/rss.asp",
  "https://www.kommersant.ru/RSS/money.xml",               # Коммерсантъ: Деньги
  "https://www.kommersant.ru/RSS/section-economics.xml",   # Коммерсантъ: Экономика
  "https://www.kommersant.ru/RSS/section-business.xml",    # Коммерсантъ: Бизнес
  "https://www.vedomosti.ru/rss/news",
  "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",
  "https://www.cbr.ru/rss/eventrss",                       # Банк России: события
  "https://www.moex.com/export/news.aspx?cat=100",         # Мосбиржа: новости
]
# Сайты, публикации которых помечаются как официальные 🏛
official_domains = ["cbr.ru", "moex.com", "sberbank.com", "sberbank.ru", "naufor.ru", "minfin.gov.ru",
                    "nalog.gov.ru", "government.ru", "spbexchange.ru"]

# Первичный фильтр (регулярные выражения, регистр не важен) — широкое сито перед редактором-ChatGPT.
# Порядок групп = приоритет при отборе кандидатов.
[keywords]
"СберИнвестиции" = [
  'сбер\w*\s*инвест',
  'sber\w*\s*invest',
  'сбер\w*.{0,60}(брокер|ИИС|инвестиционн\w*\s*сч[её]т|инвестор|доверительн|управлени\w*\s*актив)',
  '(брокер|ИИС|инвестор).{0,60}сбер(?!еж)',
  'первая\W+управляющ|сбер\s*управлени\w*\s*активами',
  # собственные облигации Сбера, которые СберИнвестиции предлагают клиентам
  '\bSBER?D\d|\bSbD\d|сбер\s*ИОС|сбербанк\s*киб|сбер\s*киб|структурн\w*\s*облигац\w*.{0,40}сбер',
  'дисконтн\w*\s*облигац\w*.{0,60}сбер|сбер\w*.{0,60}дисконтн\w*\s*облигац',
  'сб\s*секьюритизац|секьюритизац.{0,60}сбер|сбер.{0,60}секьюритизац',
  'облигац\w*\s*сбер(банк)?а?\b',
  'ипотечн\w*\s*облигац\w*.{0,80}сбер|сбер\w*.{0,80}ипотечн\w*\s*облигац',
]
"Брокеры" = [
  'брокер',
  'т-инвестиц|тинькофф\s*инвестиц',
  'альфа-инвестиц|альфа\s*капитал',
  '\bБКС\b',
  'финам',
  'втб\s*мои\s*инвестиции',
  'газпромбанк\s*инвестиц|\bатон\b|цифра\s*брокер|фридом\s*финанс|солид\s*брокер|ПСБ\s*брокер|\bАльфа-Банк\b.{0,40}инвест',
  'инвестиционн\w*\s*приложени|приложени\w*\s*для\s*инвест|автоследовани|робо-?эдвайз',
]
"Регулирование" = [
  '\bИИС\b|индивидуальн\w*\s*инвестиционн',
  'квал\w*\s*инвестор|неквал\w*|тестировани\w*.{0,40}инвестор',
  'защит\w*.{0,40}(инвестор|прав\w*\s*инвестор)|розничн\w*\s*инвестор',
  '(Банк\w*\s*Росси|\bЦБ\b|регулятор).{0,100}(брокер|инвестор|профучастник|ИИС|маржинальн|доверительн)',
  'НАУФОР|профучастни|профессиональн\w*\s*участник',
  'налог\w*.{0,60}(инвестор|ИИС|брокерск|ценн\w*\s*бумаг)|вычет\w*.{0,40}(ИИС|инвест)',
  'заблокированн\w*\s*актив|разблокир\w*.{0,40}актив',
  'программ\w*\s*долгосрочных\s*сбережений|\bПДС\b',
]
"Инфраструктура" = [
  '(мосбирж|московск\w*\s*бирж|\bMOEX\b|спб\s*бирж).{0,120}(частн\w*\s*инвестор|физлиц|розничн|брокер|счет|счёт|клиент|торгов\w*\s*(сесси|выходн|вечерн)|комисси|режим)',
  '(частн\w*\s*инвестор|физлиц|брокерск\w*\s*сч[её]т).{0,120}(мосбирж|московск\w*\s*бирж|\bMOEX\b|спб\s*бирж|депозитари)',
  'число\s*(частн\w*\s*)?инвесторов|брокерск\w*\s*сч[её]т',
]
"Отраслевые события" = [
  '(конференци|форум|саммит|круглый\s*стол|сесси[яи])\w*.{0,120}(брокер|инвестор|НАУФОР|фондов\w*\s*рын|финансов\w*\s*рын)',
  '(брокер|инвестор|НАУФОР).{0,120}(конференци|форум|саммит|круглый\s*стол)',
  'финансов\w*\s*конгресс|финополис|день\s*инвестора|инвестдн',
]

# Явный шум: отбрасывается сразу, если в тексте нет «СберИнвестиции» / брокерского контекста Сбера.
[exclude]
patterns = [
  'криптобирж|биткоин|букмекер',
  'страхов\w*',
  'подкаст|weekly\s*news|в\s*эфир|прям\w*\s*эфир|вебинар',
  'индекс\w*\s*(мосбирж\w*|ММВБ|IMOEX|РТС).{0,40}(пункт|снизил|вырос|упал|прибавил|потерял|%)',
  'торгов\w*\s*иде|технически\w*\s*анализ|точк\w*\s*вход|стоп-?лосс|тейк-?профит|цел\w*\s*по\s*акци',
  'ориентир\w*\s*(ставки\s*)?купон|книг\w*\s*заявок|сбор\w*\s*заявок|купон\w*\s*\d|доходност\w*\s*к\s*погашени',
  '\bIPO\b|\bSPO\b|листинг|делистинг|включен\w*\s*в\s*котировальн',
  'дивиденд|отчетност\w*\s*по\s*(МСФО|РСБУ)|прогноз\w*\s*(курс|цен)',
]
# …но не отбрасывается, если упоминает СберИнвестиции или брокерскую деятельность Сбера
keep_if = 'сбер\w*\s*инвест|sber\w*\s*invest|сбер\w*.{0,40}брокер|облигац\w*\s*сбер|сбер\w*.{0,60}облигац|\bSBER?D\d|\bSbD\d'

# Разделы дайджеста по порядку: ключ = заголовок. Ключи используются в ответе ChatGPT.
[sections]
sber = "🟢 СБЕРИНВЕСТИЦИИ"
brokers = "🏦 БРОКЕРЫ"
regulation = "⚖️ РЕГУЛИРОВАНИЕ"
infrastructure = "📊 БИРЖИ И ИНФРАСТРУКТУРА"
events = "🎤 ОТРАСЛЕВЫЕ СОБЫТИЯ"

# Контроль источников: предупреждение владельцу в чат робота (не в канал коллег)
[health]
fail_runs = 2       # источник не загрузился столько запусков подряд
silence_days = 7    # Telegram-канал без постов столько дней

[llm]
model = "gpt-5-mini"
timeout = 300
# Редакционная политика: по ней ChatGPT сначала отбирает материалы, затем пишет выпуск.
# Формат ответов (JSON) программа добавляет сама.
policy = """
Ты — редактор отраслевого Telegram-канала о брокерском обслуживании в России. Читатели —
руководители и продуктовые команды брокерского бизнеса Сбера (СберИнвестиции). Им нужны
новости ИНДУСТРИИ БРОКЕРСКОГО ОБСЛУЖИВАНИЯ и место СберИнвестиций в ней — не рынок ценных
бумаг и не инвестиционные советы.

БЕРЁМ:
- СберИнвестиции: продукты, тарифы, функции приложения, клиенты и их число, обороты, позиции
  в рейтингах, заявления руководителей, маркетинг и посевы СберИнвестиций, собственные
  облигации Сбера (дисконтные, структурные, секьюритизация), которые предлагаются клиентам.
- Брокеры-конкуренты как бизнес: новые продукты и сервисы, тарифы и комиссии, число клиентов
  и активов, финрезультаты брокерского бизнеса, сделки M&A, лицензии, назначения,
  выход новых игроков, рейтинги брокеров.
- Регулирование брокерской деятельности: решения и инициативы Банка России, Минфина,
  Госдумы, НАУФОР — квалы/неквалы и тестирование, ИИС, налоги инвесторов, защита розничных
  инвесторов, маржинальная торговля, требования к брокерам, санкции регулятора к брокерам,
  заблокированные активы.
- Инфраструктура для брокеров и их клиентов: новые режимы торгов, торговые часы, доступ
  частных инвесторов к инструментам, комиссии бирж, статистика Мосбиржи и ЦБ по частным
  инвесторам и брокерским счетам.
- Отраслевые конференции и форумы: что сказали представители брокеров, бирж, регулятора
  о брокерской отрасли.
- Масштабные инциденты: массовый сбой у крупного брокера, штраф или ограничение регулятора.

НЕ БЕРЁМ (даже если упомянут Сбер или брокер как источник аналитики):
- котировки, значения индексов, движение отдельных бумаг, обзоры рынка, торговые идеи,
  прогнозы курсов и цен, аналитику брокеров по рынку;
- размещения и купоны сторонних облигаций, IPO/SPO, листинги, дивиденды, отчётность
  эмитентов;
- единичные жалобы клиентов и единичные сбои;
- страхование, вклады, кредиты, криптовалюту;
- подкасты, эфиры, вебинары, рекламу чужих продуктов, развлекательный контент;
- макроэкономику и геополитику без прямого влияния на брокерскую отрасль.

Если сомневаешься — не бери. Лучше короткий выпуск из 3 сильных новостей, чем 15 слабых.
"""
