name: brokernews-check
on:
  push:
    branches: [brokernews-v3]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Candidates after filter (72h), no ChatGPT, no sending
        run: python3 -m brokernews candidates --hours 72
