name: Publish Pages (Konsilium + bonds + placements)

# Publishes konsilium/ at the site root, bonds/ at /bonds/ and placements/ at /placements/.
# The trading robot code is not part of the site.
on:
  push:
    branches: [main]
    paths: ["konsilium/**", "bonds/**", "placements/**", ".github/workflows/konsilium-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: konsilium-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r konsilium/. _site/
          mkdir -p _site/bonds
          cp -r bonds/. _site/bonds/
          mkdir -p _site/placements
          cp -r placements/. _site/placements/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
