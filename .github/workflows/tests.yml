name: Tests

# Unit tests of the trading robot on every pull request and every push to main.
# To block merging a PR with red tests: Settings -> Branches -> branch protection rule for main ->
# "Require status checks to pass before merging" -> select "unit tests".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -v
