name: probe rating sources
on: { push: { branches: [probe-ratings] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 placements/fetch_ratings.py 2>&1 | tee placements/run.log; true
      - run: python3 .probe/diag.py; true
      - run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f placements/run.log placements/diag.log placements/ratings.json && git commit -m "probe results E1 [skip ci]" && git push -f origin HEAD:refs/heads/probe-out
