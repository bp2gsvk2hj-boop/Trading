<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1621">
<title>VPN · состояние</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1621; --card:#172130; --card2:#1d2a3c; --line:#26354a; --text:#e8eef6; --mute:#8b9bb0;
    --green:#34c37a; --amber:#f2b134; --red:#ef5d5d; --blue:#4c9be8; --purple:#a37ef0; --grey:#6b7a8f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
       padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .upd{color:var(--mute);font-size:13px}
  .hero{border-radius:20px;padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:16px;
        background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line)}
  .dot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 6px rgba(255,255,255,.04)}
  .hero .t{font-size:21px;font-weight:700}
  .hero .s{color:var(--mute);font-size:14px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
  .card h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:auto}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv div{background:var(--card2);border-radius:12px;padding:9px 11px}
  .kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .kv span{color:var(--mute);font-size:12px}
  .charts .card{padding-bottom:10px}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .tabs button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;padding:6px 14px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text)}
  canvas{width:100%!important;height:220px!important}
  .ev{list-style:none;margin:0;padding:0}
  .ev li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .ev li:first-child{border-top:0}
  .ev time{color:var(--mute);min-width:112px;font-variant-numeric:tabular-nums}
  .empty{color:var(--mute);font-size:14px}
  footer{color:var(--mute);font-size:12px;margin-top:18px;text-align:center}
  .setup{max-width:520px;margin:12vh auto;text-align:center}
  .setup input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:12px 0}
  .setup button{padding:11px 20px;border-radius:12px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:600}
  .err{color:var(--red);margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="text-align:center;margin-top:20vh">Загружаю…</div></div>
<script>
const $ = s => document.querySelector(s);
const C = {green:'#34c37a', amber:'#f2b134', red:'#ef5d5d', blue:'#4c9be8', purple:'#a37ef0', grey:'#6b7a8f', mute:'#8b9bb0', line:'#26354a'};
let GIST = (location.hash || '').replace('#', '').trim();
try { if (GIST) localStorage.setItem('vpnGist', GIST); else GIST = localStorage.getItem('vpnGist') || ''; } catch (e) {}
let DATA = null, RANGE = 24, charts = [];

const fmtAgo = s => s < 90 ? 'только что' : s < 3600 ? `${Math.round(s/60)} мин назад` : s < 86400 ? `${Math.round(s/3600)} ч назад` : `${Math.round(s/86400)} дн назад`;
const two = n => String(n).padStart(2, '0');
const fmtT = (t, d) => { const x = new Date(t*1000); return d ? `${two(x.getDate())}.${two(x.getMonth()+1)} ${two(x.getHours())}:${two(x.getMinutes())}` : `${two(x.getHours())}:${two(x.getMinutes())}`; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

function setup(msg) {
  $('#app').innerHTML = `<div class="setup"><h1>VPN · состояние</h1>
    <p class="upd">Вставьте адрес страницы, который выдал сервер (<code>vpn-stats url</code>), или только код после #.</p>
    <input id="g" placeholder="https://…/vpn-status/#abc123… или abc123…"><button id="go">Открыть</button>
    ${msg ? `<div class="err">${msg}</div>` : ''}</div>`;
  $('#go').onclick = () => { const v = $('#g').value.trim().split('#').pop(); if (v) { location.hash = v; location.reload(); } };
}

async function load() {
  if (!GIST) return setup();
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST}`, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status === 404 ? 'Код не найден' : `GitHub ответил ${r.status}`);
    const g = await r.json(); const f = g.files && g.files['vpn-status.json'];
    if (!f) throw new Error('В gist нет данных');
    let txt = f.content;
    if (f.truncated) txt = await (await fetch(f.raw_url, {cache: 'no-store'})).text();
    DATA = JSON.parse(txt);
    if (!DATA.points || !DATA.points.length) throw new Error('Данных пока нет — подождите 15 минут');
    render();
  } catch (e) {
    if (!DATA) setup(e.message); else $('.upd').textContent = 'не удалось обновить: ' + e.message;
  }
}

function serverStats(pts, k) {
  const v = pts.map(p => p[k]).filter(Boolean);
  if (!v.length) return null;
  const ok = v.filter(x => x.ok), ms = ok.map(x => x.ms).filter(x => x != null);
  const sp = pts.filter(p => p[k] && p[k].mbps != null);
  const lastSp = sp.length ? sp[sp.length-1] : null;
  return { now: v[v.length-1], avail: Math.round(ok.length*100/v.length), avgMs: avg(ms), lastSp };
}

function render() {
  const now = Date.now()/1000, D = DATA, P = D.points, last = P[P.length-1];
  const age = now - D.updated, stale = age > (D.every_min || 15) * 60 * 2.7;
  const from = now - RANGE*3600, R = P.filter(p => p.t >= from);
  const s1 = serverStats(R, 's1'), s2 = serverStats(R, 's2');

  let col, title, sub;
  if (stale) { col = C.grey; title = 'Нет свежих данных'; sub = `Сервер в Москве не выходил на связь ${fmtAgo(age)} — возможно, он недоступен. Запустите vpn-doctor.sh.`; }
  else if (last.s1 && last.s1.ok) { col = C.green; title = 'VPN работает'; sub = 'Зарубежный трафик идёт через основной сервер'; }
  else if (last.s2 && last.s2.ok) { col = C.amber; title = 'VPN работает через резерв'; sub = 'Основной сервер недоступен — включился резервный'; }
  else { col = C.red; title = 'Нет выхода за рубеж'; sub = 'Оба зарубежных сервера недоступны. Российские сайты работают.'; }

  const card = (k, name, st, color) => {
    if (!st) return '';
    const n = st.now, okc = n.ok ? C.green : C.red;
    return `<div class="card"><h3><span class="dot" style="width:11px;height:11px;background:${okc}"></span>${name}
      <span class="badge" style="background:${okc}22;color:${okc}">${n.ok ? 'работает' : 'недоступен'}</span></h3>
      <div class="sub">${n.place || 'зарубежный сервер'}</div>
      <div class="kv">
        <div><b>${n.ms != null ? n.ms + ' мс' : '—'}</b><span>задержка сейчас</span></div>
        <div><b>${st.avgMs != null ? Math.round(st.avgMs) + ' мс' : '—'}</b><span>средняя за ${RANGE === 24 ? 'сутки' : 'неделю'}</span></div>
        <div><b>${st.lastSp ? st.lastSp[k].mbps + ' Мбит/с' : '—'}</b><span>скорость ${st.lastSp ? '· ' + fmtAgo(now - st.lastSp.t) : '(раз в 3 ч)'}</span></div>
        <div><b style="color:${st.avail >= 99 ? C.green : st.avail >= 90 ? C.amber : C.red}">${st.avail}%</b><span>доступность</span></div>
      </div></div>`;
  };
  const traffic = R.reduce((a, p) => a + (p.rx || 0) + (p.tx || 0), 0);
  const cpuA = avg(R.map(p => p.cpu).filter(x => x != null));
  const relay = `<div class="card"><h3><span class="dot" style="width:11px;height:11px;background:${stale ? C.grey : D.relay.xray ? C.green : C.red}"></span>Сервер в Москве
      <span class="badge" style="background:${C.blue}22;color:${C.blue}">вход</span></h3>
      <div class="sub">работает ${D.relay.uptime_h >= 48 ? Math.round(D.relay.uptime_h/24) + ' дн' : D.relay.uptime_h + ' ч'} без перезагрузки · мониторинг ${D.relay.monitor ? 'включён' : 'выключен'}</div>
      <div class="kv">
        <div><b>${last.conns ?? '—'}</b><span>устройств через приложение</span></div>
        <div><b>${last.cpu != null ? last.cpu + '%' : '—'}</b><span>процессор сейчас${cpuA != null ? ' · ср. ' + Math.round(cpuA) + '%' : ''}</span></div>
        <div><b>${last.mem}%</b><span>память</span></div>
        <div><b>${traffic >= 1024 ? (traffic/1024).toFixed(1) + ' ГБ' : traffic + ' МБ'}</b><span>трафик за ${RANGE === 24 ? 'сутки' : 'неделю'}</span></div>
      </div></div>`;

  // события: смены доступности
  const ev = [];
  for (let i = 1; i < R.length; i++) for (const [k, nm] of [['s1', 'Основной'], ['s2', 'Резерв']]) {
    const a = R[i-1][k], b = R[i][k];
    if (a && b && a.ok !== b.ok) ev.push([R[i].t, b.ok ? `🟢 ${nm} снова доступен` : `🔴 ${nm} недоступен`]);
  }
  for (let i = 1; i < R.length; i++) if (R[i].t - R[i-1].t > (D.every_min || 15) * 60 * 2.7)
    ev.push([R[i].t, `⚪ Пропуск данных ${Math.round((R[i].t - R[i-1].t)/60)} мин (сервер в Москве был недоступен или перезагружался)`]);
  ev.sort((a, b) => b[0] - a[0]);

  $('#app').innerHTML = `
    <header><h1>VPN · состояние</h1><span class="upd">обновлено ${fmtAgo(age)} · ${fmtT(D.updated, true)}</span></header>
    <div class="hero"><span class="dot" style="background:${col}"></span><div><div class="t">${title}</div><div class="s">${sub}</div></div></div>
    <div class="tabs"><button data-r="24" class="${RANGE === 24 ? 'on' : ''}">24 часа</button><button data-r="168" class="${RANGE === 168 ? 'on' : ''}">7 дней</button></div>
    <div class="grid">${card('s1', 'Основной сервер', s1)}${card('s2', 'Резервный сервер', s2)}${relay}</div>
    <div class="grid charts">
      <div class="card"><h3>Задержка через VPN, мс</h3><div class="sub">полный запрос Москва → сервер → сайт; ниже — лучше</div><canvas id="c1"></canvas></div>
      <div class="card"><h3>Скорость скачивания, Мбит/с</h3><div class="sub">замер раз в 3 часа</div><canvas id="c2"></canvas></div>
      <div class="card"><h3>Нагрузка на сервер в Москве, %</h3><div class="sub">процессор и «отбор» лимитом облака</div><canvas id="c3"></canvas></div>
      <div class="card"><h3>События</h3><div class="sub">переключения и сбои за период</div>
        ${ev.length ? `<ul class="ev">${ev.slice(0, 12).map(e => `<li><time>${fmtT(e[0], true)}</time><span>${e[1]}</span></li>`).join('')}</ul>` : '<div class="empty">Сбоев не было 👍</div>'}</div>
    </div>
    <footer>Данные обновляются раз в 15 минут · без IP-адресов и ключей</footer>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { RANGE = +b.dataset.r; render(); });
  drawCharts(R);
}

function drawCharts(R) {
  charts.forEach(c => c.destroy()); charts = [];
  const days = RANGE > 24;
  const xs = {type: 'linear', min: Date.now() - RANGE*3600e3, max: Date.now(),
    ticks: {color: C.mute, maxTicksLimit: days ? 7 : 6, callback: v => days ? fmtT(v/1000, true).slice(0, 5) : fmtT(v/1000, false)},
    grid: {color: C.line}};
  const ys = (extra) => Object.assign({beginAtZero: true, ticks: {color: C.mute}, grid: {color: C.line}}, extra || {});
  const base = {responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: 'nearest', intersect: false},
    plugins: {legend: {labels: {color: '#c9d4e2', boxWidth: 12}}, tooltip: {callbacks: {title: it => fmtT(it[0].parsed.x/1000, true)}}}};
  const line = (label, color, data, opt) => Object.assign({label, data, borderColor: color, backgroundColor: color + '33', borderWidth: 2, pointRadius: 0, tension: .25, spanGaps: false}, opt || {});
  const ser = (k, f) => R.filter(p => p[k] !== undefined).map(p => ({x: p.t*1000, y: p[k] ? f(p[k]) : null}));
  charts.push(new Chart($('#c1'), {type: 'line', options: Object.assign({}, base, {scales: {x: xs, y: ys()}}),
    data: {datasets: [line('Основной', C.green, ser('s1', v => v.ok ? v.ms : null)), line('Резерв', C.purple, ser('s2', v => v.ok ? v.ms : null))]}}));
  const sp = k => R.filter(p => p[k] && p[k].mbps != null).map(p => ({x: p.t*1000, y: p[k].mbps}));
  charts.push(new Chart($('#c2'), {type: 'line', options: Object.assign({}, base, {scales: {x: xs, y: ys()}}),
    data: {datasets: [line('Основной', C.green, sp('s1'), {pointRadius: 3, spanGaps: true}), line('Резерв', C.purple, sp('s2'), {pointRadius: 3, spanGaps: true})]}}));
  const rl = k => R.map(p => ({x: p.t*1000, y: p[k]}));
  charts.push(new Chart($('#c3'), {type: 'line', options: Object.assign({}, base, {scales: {x: xs, y: ys({suggestedMax: 30})}}),
    data: {datasets: [line('Процессор', C.blue, rl('cpu'), {fill: true}), line('Отбор лимитом (steal)', C.amber, rl('steal'))]}}));
}

load();
setInterval(load, 5*60*1000);
setInterval(() => { if (DATA) { const e = $('.upd'); if (e && !e.textContent.startsWith('не удалось')) e.textContent = `обновлено ${fmtAgo(Date.now()/1000 - DATA.updated)} · ${fmtT(DATA.updated, true)}`; } }, 30000);
</script>
</body>
</html>
