<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1621">
<title>VPN · состояние</title>
<style>
  :root{
    --bg:#0f1621; --card:#172130; --card2:#1d2a3c; --line:#26354a; --text:#e8eef6; --mute:#8b9bb0;
    --green:#34c37a; --amber:#f2b134; --red:#ef5d5d; --blue:#4c9be8; --purple:#a37ef0; --grey:#6b7a8f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
       padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .upd{color:var(--mute);font-size:13px}
  .hero{border-radius:20px;padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:16px;
        background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line)}
  .dot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 6px rgba(255,255,255,.04)}
  .hero .t{font-size:21px;font-weight:700}
  .hero .s{color:var(--mute);font-size:14px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
  .card h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:auto}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv div{background:var(--card2);border-radius:12px;padding:9px 11px}
  .kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .kv span{color:var(--mute);font-size:12px}
  .charts .card{padding-bottom:10px}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .tabs button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;padding:6px 14px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text)}
  .chart{width:100%}
  .chart svg{display:block;width:100%;height:230px}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#c9d4e2;margin:-4px 0 6px}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .ev{list-style:none;margin:0;padding:0}
  .ev li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .ev li:first-child{border-top:0}
  .ev time{color:var(--mute);min-width:112px;font-variant-numeric:tabular-nums}
  .empty{color:var(--mute);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2)}
  .rows{margin-top:12px;display:grid;gap:7px;font-size:13.5px}
  .rows div{display:flex;gap:8px;align-items:flex-start}
  .rows small{color:var(--mute)}
  .bar{margin:8px 0 12px}
  .bar .h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .bar .h span{color:var(--mute);font-variant-numeric:tabular-nums}
  .bar .tr{height:9px;border-radius:6px;background:var(--card2);overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:6px 0 2px}
  footer{color:var(--mute);font-size:12px;margin-top:18px;text-align:center}
  .setup{max-width:520px;margin:12vh auto;text-align:center}
  .setup input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:12px 0}
  .setup button{padding:11px 20px;border-radius:12px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:600}
  .err{color:var(--red);margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="text-align:center;margin-top:20vh">Загружаю…</div></div>
<script>
const $ = s => document.querySelector(s);
const C = {green:'#34c37a', amber:'#f2b134', red:'#ef5d5d', blue:'#4c9be8', purple:'#a37ef0', grey:'#6b7a8f', mute:'#8b9bb0', line:'#26354a'};
let GIST = (location.hash || '').replace('#', '').trim();
try { if (GIST) localStorage.setItem('vpnGist', GIST); else GIST = localStorage.getItem('vpnGist') || ''; } catch (e) {}
let DATA = null, RANGE = 24;

const fmtAgo = s => s < 90 ? 'только что' : s < 3600 ? `${Math.round(s/60)} мин назад` : s < 86400 ? `${Math.round(s/3600)} ч назад` : `${Math.round(s/86400)} дн назад`;
const two = n => String(n).padStart(2, '0');
const fmtT = (t, d) => { const x = new Date(t*1000); return d ? `${two(x.getDate())}.${two(x.getMonth()+1)} ${two(x.getHours())}:${two(x.getMinutes())}` : `${two(x.getHours())}:${two(x.getMinutes())}`; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const fmtMB = mb => mb >= 1024 ? (mb/1024).toFixed(mb >= 10240 ? 0 : 1) + ' ГБ' : Math.round(mb) + ' МБ';
const ptTraffic = p => p.tr ? (p.tr.app || 0) + (p.tr.router || 0) : (p.rx || 0) + (p.tx || 0);
const SVC = {youtube: 'YouTube', chatgpt: 'ChatGPT', instagram: 'Instagram', telegram: 'Telegram', netflix: 'Netflix', google: 'Google'};
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const bars = (items, total) => items.map(([n, v, c]) => `<div class="bar"><div class="h">${n}<span>${fmtMB(v)} · ${total ? Math.round(v*100/total) : 0}%</span></div>
  <div class="tr"><i style="width:${total ? Math.max(v*100/total, v > 0 ? 1.5 : 0) : 0}%;background:${c}"></i></div></div>`).join('');

function setup(msg) {
  $('#app').innerHTML = `<div class="setup"><h1>VPN · состояние</h1>
    <p class="upd">Вставьте адрес страницы, который выдал сервер (<code>vpn-stats url</code>), или только код после #.</p>
    <input id="g" placeholder="https://…/vpn-status/#abc123… или abc123…"><button id="go">Открыть</button>
    ${msg ? `<div class="err">${msg}</div>` : ''}</div>`;
  $('#go').onclick = () => { const v = $('#g').value.trim().split('#').pop(); if (v) { location.hash = v; location.reload(); } };
}

async function load() {
  if (!GIST) return setup();
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST}`, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status === 404 ? 'Код не найден' : `GitHub ответил ${r.status}`);
    const g = await r.json(); const f = g.files && g.files['vpn-status.json'];
    if (!f) throw new Error('В gist нет данных');
    let txt = f.content;
    if (f.truncated) txt = await (await fetch(f.raw_url, {cache: 'no-store'})).text();
    DATA = JSON.parse(txt);
    if (!DATA.points || !DATA.points.length) throw new Error('Данных пока нет — подождите 15 минут');
    render();
  } catch (e) {
    if (!DATA) setup(e.message); else $('.upd').textContent = 'не удалось обновить: ' + e.message;
  }
}

function serverStats(pts, k) {
  const v = pts.map(p => p[k]).filter(Boolean);
  if (!v.length) return null;
  const ok = v.filter(x => x.ok), ms = ok.map(x => x.ms).filter(x => x != null), up = avg(v.map(x => x.up != null ? x.up : (x.ok ? 1 : 0)));
  const sp = pts.filter(p => p[k] && p[k].mbps != null);
  const lastSp = sp.length ? sp[sp.length-1] : null;
  return { now: v[v.length-1], avail: Math.round(up*1000)/10, avgMs: avg(ms), lastSp };
}

function render() {
  const now = Date.now()/1000, D = DATA, P = D.points, last = P[P.length-1];
  const age = now - D.updated, stale = age > (D.every_min || 15) * 60 * 2.7;
  const src = RANGE > 168 ? (RANGE > 744 ? D.daily : D.hourly) : null;
  const STEP = RANGE > 744 ? 86400 : RANGE > 168 ? 3600 : (D.every_min || 15) * 60;
  const from = now - RANGE*3600, R = ((src && src.length) ? src : P).filter(p => p.t >= from);
  const RL = {24: 'сутки', 168: 'неделю', 720: 'месяц', 8760: 'год'}[RANGE];
  const s1 = serverStats(R, 's1'), s2 = serverStats(R, 's2');
  if (s1) s1.now = last.s1 || s1.now; if (s2) s2.now = last.s2 || s2.now;
  const spF = k => { const a = P.filter(p => p[k] && p[k].mbps != null); return a.length ? a[a.length-1] : null; };
  if (s1) s1.lastSp = spF('s1') || s1.lastSp; if (s2) s2.lastSp = spF('s2') || s2.lastSp;

  let col, title, sub;
  if (stale) { col = C.grey; title = 'Нет свежих данных'; sub = `Сервер в Москве не выходил на связь ${fmtAgo(age)} — возможно, он недоступен. Запустите vpn-doctor.sh.`; }
  else if (last.s1 && last.s1.ok) { col = C.green; title = 'VPN работает'; sub = 'Зарубежный трафик идёт через основной сервер'; }
  else if (last.s2 && last.s2.ok) { col = C.amber; title = 'VPN работает через резерв'; sub = 'Основной сервер недоступен — включился резервный'; }
  else { col = C.red; title = 'Нет выхода за рубеж'; sub = 'Оба зарубежных сервера недоступны. Российские сайты работают.'; }

  const card = (k, name, st, color) => {
    if (!st) return '';
    const n = st.now, okc = n.ok ? C.green : C.red;
    return `<div class="card"><h3><span class="dot" style="width:11px;height:11px;background:${okc}"></span>${name}
      <span class="badge" style="background:${okc}22;color:${okc}">${n.ok ? 'работает' : 'недоступен'}</span></h3>
      <div class="sub">${n.place || 'зарубежный сервер'}</div>
      <div class="kv">
        <div><b>${n.ms != null ? n.ms + ' мс' : '—'}</b><span>задержка сейчас</span></div>
        <div><b>${st.avgMs != null ? Math.round(st.avgMs) + ' мс' : '—'}</b><span>средняя за ${RL}</span></div>
        <div><b>${st.lastSp ? st.lastSp[k].mbps + ' Мбит/с' : '—'}</b><span>скорость ${st.lastSp ? '· ' + fmtAgo(now - st.lastSp.t) : '(раз в час)'}</span></div>
        <div><b style="color:${st.avail >= 99 ? C.green : st.avail >= 90 ? C.amber : C.red}">${st.avail >= 99.95 ? 100 : st.avail}%</b><span>доступность</span></div>
      </div>${svcChips(k)}</div>`;
  };
  const svcChips = k => {
    const v = D.services && D.services[k]; if (!v || !v.res) return '';
    return `<div class="chips">${Object.keys(SVC).filter(n => n in v.res).map(n => { const c = v.res[n];
      const [col, t] = c >= 200 && c < 400 ? [C.green, '✓'] : (c === 403 || c === 451) ? [C.red, '✗ блок'] : [C.amber, '?'];
      return `<span class="chip" style="color:${col}" title="код ${c}">${SVC[n]} ${t}</span>`; }).join('')}
      <span class="chip" style="color:${C.mute}">проверено ${fmtAgo(now - v.t)}</span></div>`;
  };
  const traffic = R.reduce((a, p) => a + ptTraffic(p), 0);
  const cpuA = avg(R.map(p => p.cpu).filter(x => x != null));
  const relay = `<div class="card"><h3><span class="dot" style="width:11px;height:11px;background:${stale ? C.grey : D.relay.xray ? C.green : C.red}"></span>Сервер в Москве
      <span class="badge" style="background:${C.blue}22;color:${C.blue}">вход</span></h3>
      <div class="sub">работает ${D.relay.uptime_h >= 48 ? Math.round(D.relay.uptime_h/24) + ' дн' : D.relay.uptime_h + ' ч'} без перезагрузки · мониторинг ${D.relay.monitor ? 'включён' : 'выключен'}</div>
      <div class="kv">
        <div><b>${last.conns ?? '—'}</b><span>устройств через приложение</span></div>
        <div><b>${last.cpu != null ? last.cpu + '%' : '—'}</b><span>процессор сейчас${cpuA != null ? ' · ср. ' + Math.round(cpuA) + '%' : ''}</span></div>
        <div><b>${last.mem}%</b><span>память</span></div>
        <div><b>${fmtMB(traffic)}</b><span>трафик за ${RL}</span></div>
      </div>${maint()}</div>`;

  function maint() {
    const r = D.relay || {}, rows = [];
    if (r.reboot !== undefined) rows.push(r.reboot ? ['⚠️', 'Нужна перезагрузка', 'установлено обновление ядра — <code>reboot</code>, когда VPN не нужен'] : ['✅', 'Перезагрузка не нужна']);
    if (r.updates !== undefined) rows.push(r.updates ? [r.security ? '🛡️' : '📦', `Обновлений: ${r.updates}`, r.security ? `из них безопасности: ${r.security}` : ''] : ['✅', 'Система обновлена']);
    if (r.backup_t !== undefined) {
      if (!r.backup_t) rows.push(['⚠️', 'Резервной копии нет', '<code>NOPASS=1 bash backup.sh</code>']);
      else if (r.config_t > r.backup_t) rows.push(['⚠️', `Копия устарела (${fmtAgo(now - r.backup_t)})`, 'после неё менялись настройки — сделайте новую']);
      else rows.push(['💾', `Резервная копия: ${fmtAgo(now - r.backup_t)}`, 'актуальна']);
    }
    const dc = r.doctor;
    if (dc) rows.push(dc.bad ? ['🔴', `Диагностика: проблем ${dc.bad}`, dc.issues.slice(0, 3).join('; ')] : ['🟢', `Диагностика: всё в порядке (${dc.ok})`, fmtAgo(now - dc.t)]);
    return rows.length ? `<div class="rows">${rows.map(([i, t, s]) => `<div><span>${i}</span><span>${t}${s ? `<br><small>${s}</small>` : ''}</span></div>`).join('')}</div>` : '';
  }

  // трафик по направлениям и устройствам
  const tsum = k => R.reduce((a, p) => a + (p.tr && p.tr[k] || 0), 0);
  const tDir = [['Российские сайты — напрямую', tsum('direct'), C.amber], ['Через основной сервер', tsum('f1'), C.green], ['Через резерв', tsum('f2'), C.purple]];
  const tDev = [['Приложение (телефон, планшет)', tsum('app'), C.blue], ['Домашний роутер', tsum('router'), '#38b2ac']];
  const dirT = tDir.reduce((a, x) => a + x[1], 0), devT = tDev.reduce((a, x) => a + x[1], 0);
  const trafficCard = dirT + devT > 0 ? `<div class="card"><h3>Трафик за ${RL}</h3><div class="sub">всего ${fmtMB(devT || dirT)} · один и тот же трафик в двух разрезах: куда ушёл и с какого устройства</div>
      <div class="sec">куда</div>${bars(tDir, dirT)}<div class="sec">с каких устройств</div>${bars(tDev, devT)}</div>`
    : `<div class="card"><h3>Трафик</h3><div class="sub">данные появятся после первых замеров</div></div>`;

  // месяц
  const mo = D.month && D.month.cur;
  const monthLine = (m, lbl) => {
    const pc = x => x && x.n ? (x.ok*100/x.n) : null, tr = m.tr || {}, tot = (tr.app || 0) + (tr.router || 0);
    const cell = (n, v) => `<div><b style="color:${v == null ? C.mute : v >= 99.5 ? C.green : v >= 97 ? C.amber : C.red}">${v == null ? '—' : v.toFixed(v >= 99.95 ? 0 : 1) + '%'}</b><span>${n}</span></div>`;
    return `<div class="sec">${lbl}</div><div class="kv">${cell('основной сервер', pc(m.s1))}${cell('резервный сервер', pc(m.s2))}
      <div><b>${fmtMB(tot)}</b><span>трафик</span></div><div><b>${fmtMB(tr.direct || 0)}</b><span>из них напрямую в РФ</span></div></div>`;
  };
  const mName = m => { const [y, mm] = m.split('-'); return `${MONTHS[+mm - 1]} ${y}`; };
  const monthCard = mo ? `<div class="card"><h3>Доступность за месяц</h3><div class="sub">доля успешных проверок раз в 15 минут</div>
      ${monthLine(mo, mName(mo.m))}${D.month.prev ? '<div style="height:10px"></div>' + monthLine(D.month.prev, mName(D.month.prev.m)) : ''}</div>` : '';

  // события: смены доступности
  const ev = [];
  for (let i = 1; i < R.length; i++) for (const [k, nm] of [['s1', 'Основной'], ['s2', 'Резерв']]) {
    const a = R[i-1][k], b = R[i][k];
    if (a && b && a.ok !== b.ok) ev.push([R[i].t, b.ok ? `🟢 ${nm} снова доступен` : `🔴 ${nm} недоступен`]);
  }
  if (STEP < 3600) for (let i = 1; i < R.length; i++) if (R[i].t - R[i-1].t > STEP * 2.7)
    ev.push([R[i].t, `⚪ Пропуск данных ${Math.round((R[i].t - R[i-1].t)/60)} мин (сервер в Москве был недоступен или перезагружался)`]);
  ev.sort((a, b) => b[0] - a[0]);

  $('#app').innerHTML = `
    <header><h1>VPN · состояние</h1><span class="upd">обновлено ${fmtAgo(age)} · ${fmtT(D.updated, true)}</span></header>
    <div class="hero"><span class="dot" style="background:${col}"></span><div><div class="t">${title}</div><div class="s">${sub}</div></div></div>
    <div class="tabs">${[[24, 'Сутки'], [168, 'Неделя'], [720, 'Месяц'], [8760, 'Год']].map(([r, n]) => `<button data-r="${r}" class="${RANGE === r ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="grid">${card('s1', 'Основной сервер', s1)}${card('s2', 'Резервный сервер', s2)}${relay}</div>
    <div class="grid">${trafficCard}${monthCard}</div>
    <div class="grid charts">
      <div class="card"><h3>Задержка через VPN, мс</h3><div class="sub">полный запрос Москва → сервер → сайт; ниже — лучше</div><div class="chart" id="c1"></div></div>
      <div class="card"><h3>Скорость скачивания, Мбит/с</h3><div class="sub">${RANGE > 168 ? 'среднее по замерам раз в час' : 'замер раз в час'}</div><div class="chart" id="c2"></div></div>
      <div class="card"><h3>Нагрузка на сервер в Москве, %</h3><div class="sub">процессор и «отбор» лимитом облака</div><div class="chart" id="c3"></div></div>
      <div class="card"><h3>События</h3><div class="sub">переключения и сбои за период</div>
        ${ev.length ? `<ul class="ev">${ev.slice(0, 12).map(e => `<li><time>${fmtT(e[0], true)}</time><span>${e[1]}</span></li>`).join('')}</ul>` : '<div class="empty">Сбоев не было 👍</div>'}</div>
    </div>
    <footer>Данные обновляются раз в 15 минут · без IP-адресов и ключей</footer>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { RANGE = +b.dataset.r; render(); });
  drawCharts(R);
}

function svgChart(id, sets, opt) {
  opt = opt || {};
  const host = $('#' + id), W = Math.max(host.clientWidth, 280), H = 230, pl = 38, pr = 8, pt = 8, pb = 24;
  const days = RANGE > 24, x1 = Date.now()/1000, x0 = x1 - RANGE*3600;
  const ys = sets.flatMap(s => s.pts.map(p => p.y)).filter(v => v != null);
  let top = Math.max(opt.min || 0, ...ys, 1) * 1.12;
  const step = [1,2,5,10,20,25,50,100,200,250,500,1000].find(v => top/v <= 5) || 1000; top = Math.ceil(top/step)*step;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - v/top) * (H - pt - pb);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.line}"/><text x="${pl-6}" y="${Y(v)+4}" fill="${C.mute}" font-size="11" text-anchor="end">${v}</text>`;
  const nx = W < 420 ? 4 : 6;
  for (let i = 0; i <= nx; i++) { const t = x0 + (x1-x0)*i/nx;
    g += `<text x="${X(t)}" y="${H-6}" fill="${C.mute}" font-size="11" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${RANGE > 744 ? MONTHS[new Date(t*1000).getMonth()].slice(0,3) : days ? fmtT(t, true).slice(0,5) : fmtT(t)}</text>`; }
  for (const s of sets) {
    const pts = s.pts.filter(p => p.x >= x0);
    let segs = [], cur = [];
    for (const p of pts) { if (p.y == null) { if (!s.span && cur.length) { segs.push(cur); cur = []; } } else cur.push(p); }
    if (cur.length) segs.push(cur);
    for (const sg of segs) {
      const d = sg.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      if (s.fill && sg.length > 1) g += `<path d="${d}L${X(sg[sg.length-1].x)},${Y(0)}L${X(sg[0].x)},${Y(0)}Z" fill="${s.color}22"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (s.dots || sg.length === 1) g += sg.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.color}"><title>${fmtT(p.x, true)} — ${p.y}</title></circle>`).join('');
    }
  }
  const lg = `<div class="lg">${sets.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  host.innerHTML = lg + `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function drawCharts(R) {
  const ser = (k, f) => R.filter(p => p[k] !== undefined).map(p => ({x: p.t, y: p[k] ? f(p[k]) : null}));
  svgChart('c1', [{label: 'Основной', color: C.green, pts: ser('s1', v => v.ok ? v.ms : null)},
                  {label: 'Резерв', color: C.purple, pts: ser('s2', v => v.ok ? v.ms : null)}], {min: 100});
  const sp = k => R.filter(p => p[k] && p[k].mbps != null).map(p => ({x: p.t, y: p[k].mbps}));
  svgChart('c2', [{label: 'Основной', color: C.green, pts: sp('s1'), span: true, dots: RANGE <= 168},
                  {label: 'Резерв', color: C.purple, pts: sp('s2'), span: true, dots: RANGE <= 168}], {min: 50});
  const rl = k => R.map(p => ({x: p.t, y: p[k]}));
  svgChart('c3', [{label: 'Процессор', color: C.blue, pts: rl('cpu'), fill: true},
                  {label: 'Отбор лимитом (steal)', color: C.amber, pts: rl('steal')}], {min: 20});
}
window.addEventListener('resize', () => { if (DATA) render(); });

load();
setInterval(load, 5*60*1000);
setInterval(() => { if (DATA) { const e = $('.upd'); if (e && !e.textContent.startsWith('не удалось')) e.textContent = `обновлено ${fmtAgo(Date.now()/1000 - DATA.updated)} · ${fmtT(DATA.updated, true)}`; } }, 30000);
</script>
</body>
